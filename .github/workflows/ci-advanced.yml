name: Advanced CI Pipeline

permissions:
  contents: write  # Required to push tags
  actions: read
  checks: read

on:
  push:
    branches: [dev, production]
  pull_request:
    branches: [dev, production]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version for production release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

env:
  DOCKER_REGISTRY: docker.io
  NODE_VERSION: '20'

jobs:

# ─────────────────────────────────────────────
# PREPARE
# ─────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      push: ${{ steps.tag.outputs.push }}
      is_production: ${{ steps.tag.outputs.is_production }}
      is_dev: ${{ steps.tag.outputs.is_dev }}
      image_name: ${{ steps.vars.outputs.image_name_lowercase }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Image Name Lowercase
        id: vars
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "image_name_lowercase=${REPO_NAME,,}" >> $GITHUB_OUTPUT

      - name: Resolve Tag
        id: tag
        run: |
          if [[ "${{ github.ref_name }}" == "production" ]]; then
            # Get latest tag or start from v0.0.0
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Latest tag: $LATEST_TAG"
            
            # Parse version components
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            
            # Analyze commits since last tag for Conventional Commits
            COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || echo "")
            
            # Check for breaking changes
            if echo "$COMMITS" | grep -qE "^[a-z]+(\(.+\))?!:|BREAKING CHANGE:"; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              echo "Detected BREAKING CHANGE - Major version bump"
            # Check for new features
            elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
              MINOR=$((MINOR + 1))
              PATCH=0
              echo "Detected feat - Minor version bump"
            # Check for fixes
            elif echo "$COMMITS" | grep -qE "^fix(\(.+\))?:"; then
              PATCH=$((PATCH + 1))
              echo "Detected fix - Patch version bump"
            else
              PATCH=$((PATCH + 1))
              echo "No conventional commits found - Patch version bump"
            fi
            
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            echo "New version: $NEW_TAG"
            
            # Create and push tag
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag $NEW_TAG
            git push origin $NEW_TAG
            
            echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
            echo "source=auto_semver" >> $GITHUB_OUTPUT
            echo "push=true" >> $GITHUB_OUTPUT
            echo "is_production=true" >> $GITHUB_OUTPUT
            echo "is_dev=false" >> $GITHUB_OUTPUT
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
            echo "push=true" >> $GITHUB_OUTPUT
            echo "is_production=false" >> $GITHUB_OUTPUT
            echo "is_dev=true" >> $GITHUB_OUTPUT
          fi

# ─────────────────────────────────────────────
# TEST
# ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

# ─────────────────────────────────────────────
# SONAR
# ─────────────────────────────────────────────
  sonar:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

# ─────────────────────────────────────────────
# SNYK
# ─────────────────────────────────────────────
  snyk:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - uses: snyk/actions/node@master
        with:
          command: test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

# ─────────────────────────────────────────────
# BUILD (Dev only - builds and creates artifact)
# ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [prepare, test, sonar, snyk]
    if: needs.prepare.outputs.is_dev == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Docker Build
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.tag }} .

      - name: Save Image
        run: docker save -o image.tar ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar

# ─────────────────────────────────────────────
# TRIVY (Scans the built image on dev, skipped on production)
# ─────────────────────────────────────────────
  trivy:
    runs-on: ubuntu-latest
    needs: [prepare, build]

    steps:
      - name: Skip on production
        if: needs.prepare.outputs.is_production == 'true'
        run: echo "Skipping Trivy scan on production - image was already scanned during dev build"

      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.is_dev == 'true'
        with:
          name: image

      - name: Load image
        if: needs.prepare.outputs.is_dev == 'true'
        run: docker load -i image.tar

      - uses: aquasecurity/trivy-action@master
        if: needs.prepare.outputs.is_dev == 'true'
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.tag }}
          exit-code: 1
          severity: CRITICAL,HIGH

# ─────────────────────────────────────────────
# PUSH DEV (Builds and pushes from dev branch)
# ─────────────────────────────────────────────
  push-dev:
    runs-on: ubuntu-latest
    needs: [prepare, snyk, build, trivy]
    if: needs.prepare.outputs.push == 'true' && needs.prepare.outputs.is_dev == 'true'

    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load image
        run: docker load -i image.tar

      - name: Tag and push dev image
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.tag }} ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.tag }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:latest

# ─────────────────────────────────────────────
# PUSH PROD (Promotes latest image to semver on production)
# ─────────────────────────────────────────────
  push-prod:
    runs-on: ubuntu-latest
    needs: [prepare, snyk]
    if: needs.prepare.outputs.push == 'true' && needs.prepare.outputs.is_production == 'true'

    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull latest, retag with semantic version, and push
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:latest
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:latest ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.tag }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.tag }}
          echo "Pushed production image: ${{ secrets.DOCKER_USERNAME }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.tag }}"

# ─────────────────────────────────────────────
# NOTIFY
# ─────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [prepare, test, sonar, snyk, push-dev, push-prod]

    steps:
      - name: Check Email Enabled
        id: email
        run: |
          if [ -n "${{ secrets.SMTP_HOST }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Success Mail
        if: steps.email.outputs.enabled == 'true' && success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI Success - ${{ github.event.repository.name }} (${{ needs.prepare.outputs.tag }})"
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions
          body: |
            Build succeeded for ${{ github.event.repository.name }}
            Tag: ${{ needs.prepare.outputs.tag }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

      - name: Send Failure Mail
        if: steps.email.outputs.enabled == 'true' && failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI Failed - ${{ github.event.repository.name }} (${{ needs.prepare.outputs.tag }})"
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions
          body: |
            Build failed for ${{ github.event.repository.name }}
            Tag: ${{ needs.prepare.outputs.tag }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} 